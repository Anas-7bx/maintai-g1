<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaintAI : client web</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1c1915; }
  label { display: block; margin-top: 12px; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 16px; }
  #result { margin-top: 20px; padding: 12px; border-radius: 6px; }
  .ok { background: #e6f4ea; }
  .alert { background: #fde7e7; }
  .err { background: #fff4e5; }
</style>
</head>
<body>
<h1>MaintAI</h1>
<p>Relevé de capteurs. La page doit être servie sur le port 5500, pas ouverte par un double-clic.</p>
<label>URL de l'API <input id="url" value="http://localhost:8000"></label>
<label>Clé API <input id="key" type="password" autocomplete="off"></label>
<label>Température (°C) <input id="temperature_c" type="number" step="0.1" value="72"></label>
<label>Vibration (mm/s) <input id="vibration_mm_s" type="number" step="0.1" value="6"></label>
<label>Charge (%) <input id="load_pct" type="number" step="1" value="85"></label>
<label>Heures de fonctionnement <input id="runtime_hours" type="number" step="100" value="15000"></label>
<button id="go" type="button">Prédire</button>
<div id="result"></div>
<script>
const FEATURES = ["temperature_c", "vibration_mm_s", "load_pct", "runtime_hours"];
const show = (cls, text) => {
  const zone = document.getElementById("result");
  zone.className = cls;
  zone.textContent = text;
};

document.getElementById("go").addEventListener("click", async () => {
  const reading = Object.fromEntries(FEATURES.map((champ) => [champ, Number(document.getElementById(champ).value)]));
  const adresse = document.getElementById("url").value.replace(/\/$/, "") + "/v1/predict";
  const cle = document.getElementById("key").value;
  try {
    const resp = await fetch(adresse, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": cle },
      body: JSON.stringify(reading),
    });
    const data = await resp.json();
    if (!resp.ok) {
      show("err", "Erreur " + resp.status + " : " + JSON.stringify(data.detail));
    } else if (data.alert) {
      const pourcent = (data.failure_probability * 100).toFixed(1);
      show("alert", "Probabilité de panne : " + pourcent + " % (ALERTE)");
    } else {
      const pourcent = (data.failure_probability * 100).toFixed(1);
      show("ok", "Probabilité de panne : " + pourcent + " %");
    }
  } catch (e) {
    show("err", "API injoignable (arrêtée, ou CORS qui bloque)");
  }
});
</script>
</body>
</html>
